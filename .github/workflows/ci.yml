name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # the libre-devops corpus project runs `terraform init` for registry modules
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: GOOS=js GOARCH=wasm go vet ./...
      - run: go test ./...
      - run: go build ./cmd/azemu
      - run: GOOS=js GOARCH=wasm go build -o azemu.wasm ./cmd/azemu
